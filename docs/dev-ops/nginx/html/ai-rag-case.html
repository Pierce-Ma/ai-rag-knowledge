<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen">
<div class="container mx-auto max-w-4xl h-screen flex flex-col py-4">
    <!-- 标题 -->
    <div class="mb-4">
        <h1 class="text-2xl font-bold text-gray-800">RAG 知识库管理</h1>
        <p class="text-sm text-gray-600 mt-1">上传文档，构建你的智能知识库</p>
    </div>

    <!-- 上传区域 -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-4">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">上传知识库文件</h2>
        
        <!-- 标签输入 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">知识库标签</label>
            <div class="flex space-x-2">
                <input
                    type="text"
                    id="ragTagInput"
                    placeholder="输入标签名称，如：Java教程"
                    class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <select
                    id="ragTagSelect"
                    class="p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onchange="selectTag()"
                >
                    <option value="">选择已有标签</option>
                </select>
            </div>
        </div>

        <!-- 文件上传 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">选择文件</label>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                <input
                    type="file"
                    id="fileInput"
                    multiple
                    accept=".pdf,.doc,.docx,.txt,.md"
                    class="hidden"
                    onchange="handleFileSelect(event)"
                >
                <div id="fileDropZone" class="cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <p class="mt-2 text-sm text-gray-600">点击选择文件或拖拽文件到此处</p>
                    <p class="mt-1 text-xs text-gray-500">支持 PDF、Word、TXT、Markdown 格式</p>
                </div>
                <div id="fileList" class="mt-4 text-left"></div>
            </div>
        </div>

        <!-- 上传按钮 -->
        <button
            onclick="uploadFiles()"
            id="uploadBtn"
            class="w-full px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
            disabled
        >
            上传文件
        </button>
    </div>

    <!-- 标签列表 -->
    <div class="bg-white rounded-lg shadow-lg p-6 flex-1 overflow-y-auto">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">知识库标签列表</h2>
        <div id="tagList" class="space-y-2">
            <div class="text-gray-500 text-sm">加载中...</div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8090/api/v1/rag';
    let selectedFiles = [];

    // 页面加载时获取标签列表
    window.onload = function() {
        loadTagList();
    };

    // 加载标签列表
    async function loadTagList() {
        try {
            const response = await fetch(`${API_BASE}/query_rag_tag_list`);
            const result = await response.json();
            
            if (result.code === '0000' && result.data) {
                displayTagList(result.data);
                populateTagSelect(result.data);
            } else {
                showError('加载标签列表失败');
            }
        } catch (error) {
            console.error('加载标签列表错误:', error);
            showError('加载标签列表失败');
        }
    }

    // 显示标签列表
    function displayTagList(tags) {
        const tagListContainer = document.getElementById('tagList');
        
        if (tags.length === 0) {
            tagListContainer.innerHTML = '<div class="text-gray-500 text-sm">暂无标签</div>';
            return;
        }

        tagListContainer.innerHTML = tags.map(tag => `
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
                <span class="text-gray-700 font-medium">${tag}</span>
                <span class="text-xs text-gray-500 bg-blue-100 text-blue-800 px-2 py-1 rounded">知识库</span>
            </div>
        `).join('');
    }

    // 填充标签选择下拉框
    function populateTagSelect(tags) {
        const select = document.getElementById('ragTagSelect');
        select.innerHTML = '<option value="">选择已有标签</option>' + 
            tags.map(tag => `<option value="${tag}">${tag}</option>`).join('');
    }

    // 选择标签
    function selectTag() {
        const select = document.getElementById('ragTagSelect');
        const input = document.getElementById('ragTagInput');
        if (select.value) {
            input.value = select.value;
        }
        checkUploadButton();
    }

    // 处理文件选择
    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        selectedFiles = files;
        displaySelectedFiles();
        checkUploadButton();
    }

    // 显示选中的文件
    function displaySelectedFiles() {
        const fileListContainer = document.getElementById('fileList');
        
        if (selectedFiles.length === 0) {
            fileListContainer.innerHTML = '';
            return;
        }

        fileListContainer.innerHTML = selectedFiles.map((file, index) => `
            <div class="flex items-center justify-between p-2 bg-gray-50 rounded mb-2">
                <div class="flex items-center space-x-2">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span class="text-sm text-gray-700">${file.name}</span>
                    <span class="text-xs text-gray-500">(${formatFileSize(file.size)})</span>
                </div>
                <button 
                    onclick="removeFile(${index})"
                    class="text-red-500 hover:text-red-700 text-sm"
                >
                    移除
                </button>
            </div>
        `).join('');
    }

    // 移除文件
    function removeFile(index) {
        selectedFiles.splice(index, 1);
        displaySelectedFiles();
        checkUploadButton();
        
        // 更新文件输入
        const fileInput = document.getElementById('fileInput');
        const dataTransfer = new DataTransfer();
        selectedFiles.forEach(file => dataTransfer.items.add(file));
        fileInput.files = dataTransfer.files;
    }

    // 格式化文件大小
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // 检查上传按钮状态
    function checkUploadButton() {
        const tagInput = document.getElementById('ragTagInput');
        const uploadBtn = document.getElementById('uploadBtn');
        
        if (tagInput.value.trim() && selectedFiles.length > 0) {
            uploadBtn.disabled = false;
        } else {
            uploadBtn.disabled = true;
        }
    }

    // 上传文件
    async function uploadFiles() {
        const tagInput = document.getElementById('ragTagInput');
        const ragTag = tagInput.value.trim();
        
        if (!ragTag) {
            showError('请输入知识库标签');
            return;
        }
        
        if (selectedFiles.length === 0) {
            showError('请选择要上传的文件');
            return;
        }

        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.disabled = true;
        uploadBtn.textContent = '上传中...';

        try {
            const formData = new FormData();
            formData.append('ragTag', ragTag);
            selectedFiles.forEach(file => {
                formData.append('file', file);
            });

            const response = await fetch(`${API_BASE}/file/upload`, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.code === '0000') {
                showSuccess('文件上传成功！');
                // 清空表单
                tagInput.value = '';
                selectedFiles = [];
                document.getElementById('fileInput').value = '';
                document.getElementById('fileList').innerHTML = '';
                // 重新加载标签列表
                loadTagList();
            } else {
                showError(result.msg || '上传失败');
            }
        } catch (error) {
            console.error('上传错误:', error);
            showError('上传失败：' + error.message);
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = '上传文件';
            checkUploadButton();
        }
    }

    // 显示成功消息
    function showSuccess(message) {
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.remove();
        }, 3000);
    }

    // 显示错误消息
    function showError(message) {
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.remove();
        }, 3000);
    }

    // 监听标签输入
    document.getElementById('ragTagInput').addEventListener('input', checkUploadButton);
</script>
</body>
</html>
